name: Deploy FastAPI to EC2 - Develop

on:
  push:
    branches:
      - setup-deployment-25-11-2025

env:
  OVERRIDE_NGINX: false  # Set to true to force nginx reconfiguration

jobs:
  docker-build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/chat-micro-service:dev
            ${{ secrets.DOCKER_USERNAME }}/chat-micro-service:${{ github.sha }}
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/chat-micro-service:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/chat-micro-service:buildcache,mode=max

  install-docker:
    runs-on: ubuntu-latest
    needs: docker-build-push
    steps:
      - name: Install Docker and Docker Compose on server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "=== Checking if Docker is installed ==="
            
            if ! command -v docker &> /dev/null; then
              echo "Docker not found. Installing Docker..."
              sudo apt-get update
              sudo apt-get install -y apt-transport-https ca-certificates curl gnupg lsb-release
              curl -fsSL https://download.docker.com/linux/ubuntu/gpg | sudo gpg --dearmor -o /usr/share/keyrings/docker-archive-keyring.gpg
              echo "deb [arch=amd64 signed-by=/usr/share/keyrings/docker-archive-keyring.gpg] https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable" | sudo tee /etc/apt/sources.list.d/docker.list > /dev/null
              sudo apt-get update
              sudo apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
              sudo systemctl start docker
              sudo systemctl enable docker
              sudo usermod -aG docker $USER
              echo "Docker installation completed"
            else
              echo "Docker is already installed: $(docker --version)"
            fi
            
            if ! docker compose version &> /dev/null; then
              echo "Docker Compose plugin not available. Installing..."
              sudo apt-get update
              sudo apt-get install -y docker-compose-plugin
            else
              echo "Docker Compose is available: $(docker compose version)"
            fi
            
            sudo docker --version
            sudo docker compose version
            echo "=== Docker installation check completed ==="

  setup-ssl:
    runs-on: ubuntu-latest
    needs: install-docker
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSL with Certbot Docker
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "=== Setting up SSL with Certbot Docker ==="
            
            # Create directories for certbot
            mkdir -p ./certbot/conf
            mkdir -p ./certbot/www
            mkdir -p ./logs/nginx
            
            # Stop any conflicting services temporarily for SSL generation
            echo "Checking for services using port 80..."
            CONFLICTING_SERVICE=$(sudo docker ps --format "table {{.Names}}\t{{.Ports}}" | grep "0.0.0.0:80" | head -1 | awk '{print $1}' || echo "")
            
            if [ ! -z "$CONFLICTING_SERVICE" ]; then
              echo "Found service using port 80: $CONFLICTING_SERVICE"
              echo "Temporarily stopping $CONFLICTING_SERVICE for SSL certificate generation..."
              sudo docker stop $CONFLICTING_SERVICE
              NEED_RESTART_SERVICE="$CONFLICTING_SERVICE"
            else
              NEED_RESTART_SERVICE=""
            fi
            
            # Run certbot using standalone mode (which requires port 80)
            echo "Running certbot to obtain SSL certificates using standalone mode..."
            sudo docker run --rm \
              -p 80:80 \
              -v $(pwd)/certbot/conf:/etc/letsencrypt \
              certbot/certbot certonly \
              --standalone \
              --email ${{ secrets.SSL_EMAIL }} \
              --agree-tos \
              --no-eff-email \
              --staging \
              -d chat.valcertra.com \
              -d www.chat.valcertra.com
            
            # Restart the conflicting service if we stopped it
            if [ ! -z "$NEED_RESTART_SERVICE" ]; then
              echo "Restarting $NEED_RESTART_SERVICE..."
              sudo docker start $NEED_RESTART_SERVICE
            fi
            
            # Verify certificates were created
            if [ -f "./certbot/conf/live/chat.valcertra.com/fullchain.pem" ]; then
              echo "✅ SSL certificates obtained successfully"
            else
              echo "❌ Failed to obtain SSL certificates"
              exit 1
            fi
            
            echo "=== SSL setup completed ==="

  update-environment:
    runs-on: ubuntu-latest
    needs: setup-ssl
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ensure remote docker-compose path is clear
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            REMOTE_PATH="./docker-compose.dev.yml"
            if [ -d "$REMOTE_PATH" ]; then rm -rf "$REMOTE_PATH"; fi
            if [ -f "$REMOTE_PATH" ]; then rm -f "$REMOTE_PATH"; fi

      - name: Copy docker-compose.dev.yml to server
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docker-compose.dev.yml"
          target: "."

      - name: Update Docker Deployment Files
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "=== Updating Environment Variables ==="
            
            # Remove existing environment file if it exists
            if [ -f ".env.dev" ]; then
              echo "Removing existing .env.dev file..."
              rm -f .env.dev
            fi
            
            # Stop existing containers first to ensure they pick up new environment
            COMPOSE_CMD="sudo docker compose"
            if groups $USER | grep -q docker; then
              COMPOSE_CMD="docker compose"
            fi
            $COMPOSE_CMD -f docker-compose.dev.yml down --remove-orphans 2>/dev/null || true
            
            # Ensure directories exist
            mkdir -p ./certbot/conf
            mkdir -p ./certbot/www
            mkdir -p ./logs/nginx
            
            # Verify SSL certificates exist
            if [ -f "./certbot/conf/live/chat.valcertra.com/fullchain.pem" ]; then
              echo "✅ SSL certificates found and ready for use"
            else
              echo "❌ SSL certificates not found. This should not happen after SSL setup step."
              exit 1
            fi
            
            echo "Environment setup completed"

  deploy-docker:
    runs-on: ubuntu-latest
    needs: update-environment
    steps:
      - name: Deploy and restart Docker containers
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "=== Starting Docker deployment ==="
            DOCKER_CMD="sudo docker"
            COMPOSE_CMD="sudo docker compose"
            if groups $USER | grep -q docker; then
              DOCKER_CMD="docker"
              COMPOSE_CMD="docker compose"
            fi
            
            # Login to Docker Hub
            echo "${{ secrets.DOCKER_TOKEN }}" | $DOCKER_CMD login --username "${{ secrets.DOCKER_USERNAME }}" --password-stdin
            
            # Set environment variables for docker-compose
            export DATABASE_URL="${{ secrets.DATABASE_URL }}"
            export JWT_SECRET_KEY="${{ secrets.JWT_SECRET_KEY }}"
            export SSL_EMAIL="${{ secrets.SSL_EMAIL }}"
            
            # Pull latest images
            echo "=== Pulling latest images ==="
            $COMPOSE_CMD -f docker-compose.dev.yml pull
            
            # Stop existing containers and remove them completely
            echo "=== Stopping and removing existing containers ==="
            $COMPOSE_CMD -f docker-compose.dev.yml down --remove-orphans || true
            
            # Start Redis first
            echo "=== Starting Redis ==="
            $COMPOSE_CMD -f docker-compose.dev.yml up -d redis_chat_dev
            
            # Wait for Redis to be ready
            echo "=== Waiting for Redis to be ready ==="
            for i in {1..30}; do
              if $COMPOSE_CMD -f docker-compose.dev.yml exec -T redis_chat_dev redis-cli ping | grep -q PONG; then
                echo "✅ Redis is ready!"
                break
              else
                echo "⏳ Attempt $i: Redis not ready yet, waiting..."
                sleep 2
              fi
            done
            
            # Start web service
            echo "=== Starting web service ==="
            $COMPOSE_CMD -f docker-compose.dev.yml up -d web
            
            # Wait for web service to be running
            echo "=== Waiting for web service to start ==="
            for i in {1..60}; do
              if $COMPOSE_CMD -f docker-compose.dev.yml exec -T web curl -f http://localhost:8080/health > /dev/null 2>&1; then
                echo "✅ Web service is healthy!"
                break
              else
                echo "⏳ Attempt $i: Web service not ready yet, waiting..."
                sleep 5
              fi
            done
            
            # Start nginx
            echo "=== Starting Nginx ==="
            $COMPOSE_CMD -f docker-compose.dev.yml up -d nginx
            sleep 15
            
            echo "=== Container status ==="
            $COMPOSE_CMD -f docker-compose.dev.yml ps
            
            # Verify JWT_SECRET_KEY is properly loaded in container
            echo "=== Verifying JWT_SECRET_KEY in container ==="
            sleep 5
            if $COMPOSE_CMD -f docker-compose.dev.yml ps web | grep -q "Up"; then
              echo "Checking JWT_SECRET_KEY in container..."
              $COMPOSE_CMD -f docker-compose.dev.yml exec -T web python -c "
            from app.core.config import settings
            jwt_key = settings.jwt_secret_key
            print(f'JWT_SECRET_KEY loaded: {jwt_key[:15]}...' if jwt_key else 'JWT_SECRET_KEY not found!')
            print(f'JWT_SECRET_KEY length: {len(jwt_key)}')
            " || echo "Failed to verify environment variables in container"
            else
              echo "Web container is not running, skipping JWT verification"
            fi

  run-migrations:
    runs-on: ubuntu-latest
    needs: deploy-docker
    steps:
      - name: Run Database Migrations
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "=== Running Database Migrations ==="
            COMPOSE_CMD="sudo docker compose"
            if groups $USER | grep -q docker; then
              COMPOSE_CMD="docker compose"
            fi
            
            # Check if web container is running
            if ! $COMPOSE_CMD -f docker-compose.dev.yml ps web | grep -q "Up"; then
              echo "❌ Web container is not running. Starting it..."
              $COMPOSE_CMD -f docker-compose.dev.yml up -d web
              sleep 10
            fi
            
            # Run Alembic migrations
            echo "=== Running Alembic migrations ==="
            $COMPOSE_CMD -f docker-compose.dev.yml exec -T web alembic upgrade head
            
            if [ $? -eq 0 ]; then
              echo "✅ Database migrations completed successfully"
            else
              echo "❌ Database migrations failed"
              
              # Show migration history for debugging
              echo "=== Migration History ==="
              $COMPOSE_CMD -f docker-compose.dev.yml exec -T web alembic history || true
              
              # Show current migration status
              echo "=== Current Migration Status ==="
              $COMPOSE_CMD -f docker-compose.dev.yml exec -T web alembic current || true
              
              exit 1
            fi
            
            # Show final migration status
            echo "=== Final Migration Status ==="
            $COMPOSE_CMD -f docker-compose.dev.yml exec -T web alembic current
            
            echo "=== Database migrations completed ==="

  health-check:
    runs-on: ubuntu-latest
    needs: run-migrations
    steps:
      - name: Final Health Check and Cleanup
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "=== Final Health Check ==="
            DOCKER_CMD="sudo docker"
            COMPOSE_CMD="sudo docker compose"
            if groups $USER | grep -q docker; then
              DOCKER_CMD="docker"
              COMPOSE_CMD="docker compose"
            fi
            
            # Check container status
            echo "=== Container Status ==="
            $COMPOSE_CMD -f docker-compose.dev.yml ps
            
            # Test application health through nginx
            echo "=== Testing application health through nginx ==="
            for i in {1..10}; do
              if curl -f http://localhost:8004/health; then
                echo "✅ Application is healthy through nginx!"
                break
              else
                echo "⏳ Attempt $i: Application not ready through nginx yet, waiting..."
                sleep 10
              fi
            done
            
            # Test through domain (if SSL is setup)
            echo "=== Testing through domain ==="
            if curl -f -k https://chat.valcertra.com:8443/health 2>/dev/null; then
              echo "✅ Application accessible through domain with SSL!"
            elif curl -f http://chat.valcertra.com:8004/health 2>/dev/null; then
              echo "✅ Application accessible through domain!"
            else
              echo "⚠️  Application not accessible through domain (this may be expected if domain is not configured yet)"
            fi
            
            # Show recent logs
            echo "=== Recent Application Logs ==="
            $COMPOSE_CMD -f docker-compose.dev.yml logs --tail=20 web
            $COMPOSE_CMD -f docker-compose.dev.yml logs --tail=20 nginx
            
            # Clean up unused images
            echo "=== Cleaning up unused Docker images ==="
            $DOCKER_CMD image prune -f
            
            echo "=== Chat Microservice deployment completed successfully! ==="