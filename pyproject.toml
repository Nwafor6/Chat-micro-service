[tool.poetry]
name = "chat-service"
version = "0.1.0"
description = "BildupAI real-time chat microservice with JWT authentication"
authors = ["nwafor6 <nwaforglory6@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.104.0"
uvicorn = {extras = ["standard"], version = "^0.24.0"}
pydantic = "^2.5.0"
pydantic-settings = "^2.1.0"
pymongo = "^4.6.0"
motor = "^3.3.0"
redis = "^5.0.0"
pyjwt = "^2.8.0"
loguru = "^0.7.2"
jinja2 = "^3.1.2"
requests = "^2.31.0"
aioboto3 = "^12.3.0"
python-multipart = "^0.0.6"
alembic = "^1.17.0"
asyncpg = "^0.30.0"
psycopg2-binary = "^2.9.11"
python-jose = "^3.5.0"
passlib = {extras = ["argon2"], version = "^1.7.4"}
httpx = "^0.28.1"
sqladmin = "^0.22.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-asyncio = "^0.23.0"
black = "^23.12.0"
isort = "^5.13.0"
flake8 = "^7.0.0"
mypy = "^1.8.0"
pre-commit = "^4.2.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
dev = "run:main"

[tool.black]
line-length = 88
target-version = ['py312']

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
