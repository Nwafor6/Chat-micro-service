services:
  web:
    image: nwafor6/bildupai_chat:dev
    restart: always
    ports:
      - "8080:8080"
    volumes:
      - ./logs:/app/logs
    env_file:
      - .env.dev
    depends_on:
      - postgres_dev
      - redis_dev
    networks:
      - bildupai_chat_dev
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  postgres_dev:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_DB: bildupai_chat_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bildupai_chat_dev

  redis_dev:
    image: redis:7-alpine
    restart: always
    volumes:
      - redis_data_dev:/data
    ports:
      - "6380:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bildupai_chat_dev

  # Optional: Redis Commander for Redis management
  redis-commander:
    image: rediscommander/redis-commander:latest
    restart: always
    environment:
      - REDIS_HOSTS=local:redis_dev:6379
    ports:
      - "8081:8081"
    depends_on:
      - redis_dev
    networks:
      - bildupai_chat_dev

volumes:
  postgres_data_dev:
  redis_data_dev:


networks:
  bildupai_chat_dev:
    name: bildupai_chat_dev
