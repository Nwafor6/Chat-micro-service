services:
  web:
    image: nwafor6/chat-micro-service:dev
    restart: always
    volumes:
      - ./logs:/app/logs
    networks:
      - chat_micro_service_dev
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    environment:
      - REDIS_URL=redis://redis_chat_dev:6379
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - APP_NAME=Global Chat Service
      - ENV=development
      - DEBUG=true
      - BASE_URL=https://chat.valcertra.com
      - API_PREFIX=/api/v1
      - DB_TYPE=postgres
      - JWT_ALGORITHM=HS256
      - JWT_TOKEN_TTL=10080
      - REDIS_DB=0
      - LOG_LEVEL=INFO
      - LOG_FORMAT=json

  redis_chat_dev:
    image: redis:7-alpine
    restart: always
    volumes:
      - redis_chat_data_dev:/data
    ports:
      - "6380:6379" # Changed from 6381 to 6380 for chat service
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - chat_micro_service_dev

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "8003:80"   # Changed from 8004 to 8003 (available port)
      - "8444:443"  # Changed from 8443 to 8444 for HTTPS
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro # SSL certificates from certbot
      - ./certbot/www:/var/www/certbot:ro # Let's Encrypt challenges
      - ./logs/nginx:/var/log/nginx
    depends_on:
      - web
    networks:
      - chat_micro_service_dev
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health" ]
      interval: 30s
      timeout: 10s
      retries: 3

  certbot:
    image: certbot/certbot:latest
    container_name: certbot_chat_service
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    environment:
      - SSL_EMAIL=${SSL_EMAIL}
    command: certonly --webroot --webroot-path=/var/www/certbot --email ${SSL_EMAIL} --agree-tos --no-eff-email --staging -d chat.valcertra.com -d www.chat.valcertra.com
    networks:
      - chat_micro_service_dev

volumes:
  redis_chat_data_dev:

networks:
  chat_micro_service_dev:
    name: chat_micro_service_dev