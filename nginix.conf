server {
    listen 80;
    server_name bildup.ai 157.245.113.73 chat1.valcertra.com www.chat1.valcertra.com;


    # Proxy dynamic HTTP requests to Daphne
    # location / {
    #     proxy_pass http://127.0.0.1:8080;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }

    location / {
        # --- CORS FIX: NGINX HANDLES OPTIONS ONLY ---
        if ($request_method = 'OPTIONS') {
            # 1. Nginx sends the required headers for the browser to allow the main request
            add_header 'Access-Control-Allow-Origin' 'https://www.valcertra.com' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, X-Requested-With' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;

            # 2. Immediately return a success status (204 No Content)
            # This prevents the request from hitting the application (for performance/simplicity)
            return 204;
        }
        # --- END OPTIONS HANDLING ---

        # --- Standard Proxy Pass for GET, POST, PUT, DELETE ---
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }


    # WebSocket support
    location /ws/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }


    # Serve static files
    location /static/ {
        alias /home/ubuntu/buildup_math_ai_mvp/static/;
    }


    # Serve media files
    location /media/ {
        alias /home/ubuntu/buildup_math_ai_mvp/media/;
    }
}
