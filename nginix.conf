server {
    listen 80;
    server_name bildup.ai 157.245.113.73 chat2.valcertra.com www.chat2.valcertra.com;


    # Proxy dynamic HTTP requests to Daphne
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }


    # WebSocket support
    location /ws/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }


    # Serve static files
    location /static/ {
        alias /home/ubuntu/buildup_math_ai_mvp/static/;
    }


    # Serve media files
    location /media/ {
        alias /home/ubuntu/buildup_math_ai_mvp/media/;
    }
}
