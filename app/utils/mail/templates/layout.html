<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>{{ subject or "SafePazz" }}</title>
        <style>
            /* Import Roboto font */
            @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap');

            body {
                margin: 0 auto !important;
                padding-top: 50px;
                padding-top: 50px;
                height: 100% !important;
                width: 100% !important;
                font-family: 'Roboto', sans-serif !important;
                font-size: 14px;
                margin-bottom: 10px;
                line-height: 24px;
                color: #8094ae;
                font-weight: 400;
                -webkit-text-size-adjust: 100%;
                background-color: #f5f6fa;
            }
            table {
                border-spacing: 0;
                border-collapse: collapse;
                width: 100%;
                max-width: 600px;
                margin: auto;
                border-radius: 8px;
                overflow: hidden;
            }

            h1 {
                color: #3d4852;
                font-size: 18px;
                font-weight: bold;
                margin-top: 0;
                text-align: left;
            }

            h2 {
                font-size: 16px;
                font-weight: bold;
                margin-top: 0;
                text-align: left;
            }

            h3 {
                font-size: 14px;
                font-weight: bold;
                margin-top: 0;
                text-align: left;
            }

            p {
                font-size: 16px;
                line-height: 1.5em;
                margin-top: 0;
                text-align: left;
            }

            p.sub {
                font-size: 12px;
            }

            img {
                max-width: 100%;
            }

            table {
                margin: 10px auto;
                width: 100%;
            }

            table th {
                margin: 0;
                border-right: none;
                border-left: none;
                padding-bottom: 8px;
            }

            table td {
                color: #74787e;
                font-size: 15px;
                line-height: 18px;
                margin: 0;
                padding: 10px 5px;
                border: none;
            }

            a {
                text-decoration: none;
            }

            img {
                -ms-interpolation-mode: bicubic;
            }

            h2 {
                font-size: 24px;
                line-height: 32px;
                color: #2d3748;
                font-weight: 600;
                margin-bottom: 20px;
            }

            br {
                display: block;
                padding: 10px 0;
            }

            .header {
                padding: 20px;
                text-align: center;
            }

            .header img {
                max-width: 200px;
                display: block;
                margin: 0 auto 10px;
            }

            .content {
                -premailer-cellpadding: 0;
                -premailer-cellspacing: 0;
                -premailer-width: 100%;
                background-color: #edf2f7;
                border-bottom: 1px solid #edf2f7;
                border-top: 1px solid #edf2f7;
                margin: 0;
                padding: 0;
                width: 100%;
                padding: 25px;
                font-size: 16px;
                background: #fff;
            }

            .button {
                display: inline-block;
                padding: 12px 20px;
                margin: 20px 0;
                background: #6d5aab;
                color: white;
                text-decoration: none;
                border-radius: 5px;
                font-weight: bold;
            }

            .footer {
                text-align: center;
                padding: 20px;
                font-size: 14px;
                color: #666666;
            }

            a {
                color: #6d5aab;
                text-decoration: none;
            }

            /* Responsive Design */
            @media screen and (max-width: 600px) {
                .content,
                .footer {
                    padding: 15px;
                }
            }
        </style>
    </head>

    <body>
        <table>
            <tr>
                <td class="header">
                    <img
                        src="https://api.safepazz.com/images/safepazz.png"
                        alt="SafePazz Logo"
                    />
                </td>
            </tr>
            <tr>
                <td class="content">{% block content %}{% endblock %}</td>
            </tr>
            <tr>
                <td class="footer">
                    Copyright &copy; {{ now().year }} SafePazz. All rights
                    reserved.<br />
                    <a href="https://safepazz.com">safepazz.com</a>
                </td>
            </tr>
        </table>
    </body>
</html>
